<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f1115;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }

  .game-card {
    background: #1a1d24;
    border: 1px solid #2e323c;
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
  }

  h1 {
    color: #eaeaea;
    font-size: 20px;
    margin: 0;
    letter-spacing: 1px;
  }

  .score {
    color: #7be495;
    font-weight: bold;
    font-size: 16px;
    background: #12151b;
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid #2e323c;
  }

  canvas {
    background: #12151b;
    border-radius: 10px;
    border: 1px solid #2e323c;
    display: block;
  }

  .controls {
    display: flex;
    gap: 10px;
  }

  button {
    background: #2e323c;
    color: #eaeaea;
    border: none;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 14px;
    cursor: pointer;
  }

  button:hover {
    background: #3a3f4b;
  }

  .hint {
    color: #8a8f98;
    font-size: 13px;
    text-align: center;
  }

  .overlay-msg {
    color: #ff6b6b;
    font-weight: bold;
    font-size: 14px;
    min-height: 18px;
  }
</style>
</head>
<body>

  <div class="game-card">
    <div class="header">
      <h1>SNAKE</h1>
      <div class="score" id="scoreDisplay">Score: 0</div>
    </div>

    <canvas id="board" width="400" height="400"></canvas>

    <div class="overlay-msg" id="statusMsg"></div>

    <div class="controls">
      <button id="startBtn">Start</button>
      <button id="pauseBtn">Pause</button>
      <button id="resetBtn">Reset</button>
    </div>

    <div class="hint">Use arrow keys or WASD to move</div>
  </div>

<script>
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const scoreDisplay = document.getElementById('scoreDisplay');
  const statusMsg = document.getElementById('statusMsg');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const resetBtn = document.getElementById('resetBtn');

  const gridSize = 20;
  const tileCount = canvas.width / gridSize;

  let snake, direction, nextDirection, food, score, loopId, running, paused;

  const initState = () => {
    snake = [{ x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }];
    direction = { x: 1, y: 0 };
    nextDirection = { x: 1, y: 0 };
    score = 0;
    running = false;
    paused = false;
    scoreDisplay.textContent = 'Score: 0';
    statusMsg.textContent = '';
    placeFood();
    draw();
  };

  const placeFood = () => {
    let valid = false;
    while (!valid) {
      food = {
        x: Math.floor(Math.random() * tileCount),
        y: Math.floor(Math.random() * tileCount)
      };
      valid = !snake.some(seg => seg.x === food.x && seg.y === food.y);
    }
  };

  const draw = () => {
    ctx.fillStyle = '#12151b';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#ff6b6b';
    ctx.fillRect(food.x * gridSize + 2, food.y * gridSize + 2, gridSize - 4, gridSize - 4);

    snake.forEach((seg, i) => {
      ctx.fillStyle = i === 0 ? '#7be495' : '#4f9d6e';
      ctx.fillRect(seg.x * gridSize + 1, seg.y * gridSize + 1, gridSize - 2, gridSize - 2);
    });
  };

  const step = () => {
    if (paused) return;

    direction = nextDirection;
    const head = {
      x: snake[0].x + direction.x,
      y: snake[0].y + direction.y
    };

    const hitsWall = head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount;
    const hitsSelf = snake.some(seg => seg.x === head.x && seg.y === head.y);

    if (hitsWall || hitsSelf) {
      endGame();
      return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreDisplay.textContent = `Score: ${score}`;
      placeFood();
    } else {
      snake.pop();
    }

    draw();
  };

  const endGame = () => {
    running = false;
    clearInterval(loopId);
    statusMsg.textContent = 'Game over — press Reset to try again';
  };

  const startGame = () => {
    if (running) return;
    running = true;
    paused = false;
    statusMsg.textContent = '';
    loopId = setInterval(step, 110);
  };

  const togglePause = () => {
    if (!running) return;
    paused = !paused;
    statusMsg.textContent = paused ? 'Paused' : '';
  };

  const resetGame = () => {
    clearInterval(loopId);
    initState();
  };

  const keyMap = {
    ArrowUp: { x: 0, y: -1 }, w: { x: 0, y: -1 }, W: { x: 0, y: -1 },
    ArrowDown: { x: 0, y: 1 }, s: { x: 0, y: 1 }, S: { x: 0, y: 1 },
    ArrowLeft: { x: -1, y: 0 }, a: { x: -1, y: 0 }, A: { x: -1, y: 0 },
    ArrowRight: { x: 1, y: 0 }, d: { x: 1, y: 0 }, D: { x: 1, y: 0 }
  };

  document.addEventListener('keydown', (e) => {
    const dir = keyMap[e.key];
    if (!dir) return;
    e.preventDefault();

    const isReverse = dir.x === -direction.x && dir.y === -direction.y;
    if (!isReverse) nextDirection = dir;

    if (!running) startGame();
  });

  startBtn.addEventListener('click', startGame);
  pauseBtn.addEventListener('click', togglePause);
  resetBtn.addEventListener('click', resetGame);

  initState();
</script>

</body>
</html>
