<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rock Splitter</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f1115;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }

  .game-card {
    background: #1a1d24;
    border: 1px solid #2e323c;
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
  }

  h1 {
    color: #eaeaea;
    font-size: 20px;
    margin: 0;
    letter-spacing: 1px;
  }

  .stats {
    display: flex;
    gap: 10px;
  }

  .stat {
    color: #7be495;
    font-weight: bold;
    font-size: 14px;
    background: #12151b;
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid #2e323c;
  }

  canvas {
    background: #05070a;
    border-radius: 10px;
    border: 1px solid #2e323c;
    display: block;
  }

  .controls {
    display: flex;
    gap: 10px;
  }

  button {
    background: #2e323c;
    color: #eaeaea;
    border: none;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 14px;
    cursor: pointer;
  }

  button:hover {
    background: #3a3f4b;
  }

  .hint {
    color: #8a8f98;
    font-size: 13px;
    text-align: center;
  }

  .overlay-msg {
    color: #ff6b6b;
    font-weight: bold;
    font-size: 14px;
    min-height: 18px;
  }
</style>
</head>
<body>

  <div class="game-card">
    <div class="header">
      <h1>ROCK SPLITTER</h1>
      <div class="stats">
        <div class="stat" id="scoreDisplay">Score: 0</div>
        <div class="stat" id="livesDisplay">Lives: 3</div>
      </div>
    </div>

    <canvas id="board" width="480" height="480"></canvas>

    <div class="overlay-msg" id="statusMsg"></div>

    <div class="controls">
      <button id="startBtn">Start</button>
      <button id="pauseBtn">Pause</button>
      <button id="resetBtn">Reset</button>
    </div>

    <div class="hint">Arrow keys / A&nbsp;D to rotate, W to thrust, Space to fire</div>
  </div>

<script>
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const scoreDisplay = document.getElementById('scoreDisplay');
  const livesDisplay = document.getElementById('livesDisplay');
  const statusMsg = document.getElementById('statusMsg');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const resetBtn = document.getElementById('resetBtn');

  const W = canvas.width;
  const H = canvas.height;

  let ship, bullets, rocks, keys, score, lives, running, paused, loopId, lastShot;

  const wrap = (obj) => {
    if (obj.x < 0) obj.x += W;
    if (obj.x > W) obj.x -= W;
    if (obj.y < 0) obj.y += H;
    if (obj.y > H) obj.y -= H;
  };

  const makeRock = (size, x, y) => {
    const angle = Math.random() * Math.PI * 2;
    const speed = 0.5 + Math.random() * (2.2 - size * 0.4);
    const points = 8 + Math.floor(Math.random() * 4);
    const offsets = Array.from({ length: points }, () => 0.7 + Math.random() * 0.5);
    return {
      x: x ?? Math.random() * W,
      y: y ?? Math.random() * H,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size,
      radius: size * 14,
      rotation: Math.random() * Math.PI * 2,
      spin: (Math.random() - 0.5) * 0.03,
      offsets
    };
  };

  const spawnRockWave = (count) => {
    const newRocks = [];
    for (let i = 0; i < count; i++) {
      let x, y;
      do {
        x = Math.random() * W;
        y = Math.random() * H;
      } while (Math.hypot(x - ship.x, y - ship.y) < 100);
      newRocks.push(makeRock(3, x, y));
    }
    return newRocks;
  };

  const initState = () => {
    ship = { x: W / 2, y: H / 2, vx: 0, vy: 0, angle: -Math.PI / 2, thrusting: false, invuln: 0 };
    bullets = [];
    rocks = spawnRockWave(5);
    keys = {};
    score = 0;
    lives = 3;
    running = false;
    paused = false;
    lastShot = 0;
    scoreDisplay.textContent = 'Score: 0';
    livesDisplay.textContent = 'Lives: 3';
    statusMsg.textContent = '';
    draw();
  };

  const splitRock = (rock) => {
    score += (4 - rock.size) * 20;
    scoreDisplay.textContent = `Score: ${score}`;
    if (rock.size > 1) {
      rocks.push(makeRock(rock.size - 1, rock.x, rock.y));
      rocks.push(makeRock(rock.size - 1, rock.x, rock.y));
    }
  };

  const resetShipPosition = () => {
    ship.x = W / 2;
    ship.y = H / 2;
    ship.vx = 0;
    ship.vy = 0;
    ship.angle = -Math.PI / 2;
    ship.invuln = 120;
  };

  const loseLife = () => {
    lives -= 1;
    livesDisplay.textContent = `Lives: ${lives}`;
    if (lives <= 0) {
      endGame();
    } else {
      resetShipPosition();
    }
  };

  const update = () => {
    if (paused) return;

    if (keys['ArrowLeft'] || keys['a'] || keys['A']) ship.angle -= 0.06;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) ship.angle += 0.06;

    ship.thrusting = !!(keys['ArrowUp'] || keys['w'] || keys['W']);
    if (ship.thrusting) {
      ship.vx += Math.cos(ship.angle) * 0.12;
      ship.vy += Math.sin(ship.angle) * 0.12;
    }

    ship.vx *= 0.99;
    ship.vy *= 0.99;
    ship.x += ship.vx;
    ship.y += ship.vy;
    wrap(ship);

    if (ship.invuln > 0) ship.invuln -= 1;

    if ((keys[' '] || keys['Spacebar']) && Date.now() - lastShot > 260) {
      bullets.push({
        x: ship.x + Math.cos(ship.angle) * 16,
        y: ship.y + Math.sin(ship.angle) * 16,
        vx: Math.cos(ship.angle) * 6 + ship.vx,
        vy: Math.sin(ship.angle) * 6 + ship.vy,
        life: 60
      });
      lastShot = Date.now();
    }

    bullets.forEach(b => {
      b.x += b.vx;
      b.y += b.vy;
      b.life -= 1;
      wrap(b);
    });
    bullets = bullets.filter(b => b.life > 0);

    rocks.forEach(r => {
      r.x += r.vx;
      r.y += r.vy;
      r.rotation += r.spin;
      wrap(r);
    });

    // bullet vs rock
    for (let bi = bullets.length - 1; bi >= 0; bi--) {
      const b = bullets[bi];
      for (let ri = rocks.length - 1; ri >= 0; ri--) {
        const r = rocks[ri];
        if (Math.hypot(b.x - r.x, b.y - r.y) < r.radius) {
          splitRock(r);
          rocks.splice(ri, 1);
          bullets.splice(bi, 1);
          break;
        }
      }
    }

    // ship vs rock
    if (ship.invuln <= 0) {
      for (const r of rocks) {
        if (Math.hypot(ship.x - r.x, ship.y - r.y) < r.radius + 8) {
          loseLife();
          break;
        }
      }
    }

    if (rocks.length === 0) {
      rocks = spawnRockWave(6);
    }

    draw();
  };

  const drawShip = () => {
    if (ship.invuln > 0 && Math.floor(ship.invuln / 6) % 2 === 0) return;
    ctx.save();
    ctx.translate(ship.x, ship.y);
    ctx.rotate(ship.angle);
    ctx.strokeStyle = '#7be495';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(16, 0);
    ctx.lineTo(-12, 10);
    ctx.lineTo(-6, 0);
    ctx.lineTo(-12, -10);
    ctx.closePath();
    ctx.stroke();

    if (ship.thrusting) {
      ctx.strokeStyle = '#ff9d4f';
      ctx.beginPath();
      ctx.moveTo(-6, 0);
      ctx.lineTo(-18, 0);
      ctx.stroke();
    }
    ctx.restore();
  };

  const drawRock = (r) => {
    ctx.save();
    ctx.translate(r.x, r.y);
    ctx.rotate(r.rotation);
    ctx.strokeStyle = '#c9cdd6';
    ctx.lineWidth = 2;
    ctx.beginPath();
    r.offsets.forEach((off, i) => {
      const a = (i / r.offsets.length) * Math.PI * 2;
      const px = Math.cos(a) * r.radius * off;
      const py = Math.sin(a) * r.radius * off;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    });
    ctx.closePath();
    ctx.stroke();
    ctx.restore();
  };

  const draw = () => {
    ctx.fillStyle = '#05070a';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#ffe38a';
    bullets.forEach(b => {
      ctx.beginPath();
      ctx.arc(b.x, b.y, 2, 0, Math.PI * 2);
      ctx.fill();
    });

    rocks.forEach(drawRock);
    drawShip();
  };

  const endGame = () => {
    running = false;
    clearInterval(loopId);
    statusMsg.textContent = 'Game over — press Reset to try again';
  };

  const startGame = () => {
    if (running) return;
    running = true;
    paused = false;
    statusMsg.textContent = '';
    loopId = setInterval(update, 1000 / 60);
  };

  const togglePause = () => {
    if (!running) return;
    paused = !paused;
    statusMsg.textContent = paused ? 'Paused' : '';
  };

  const resetGame = () => {
    clearInterval(loopId);
    initState();
  };

  document.addEventListener('keydown', (e) => {
    keys[e.key] = true;
    if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
      e.preventDefault();
    }
    if (!running) startGame();
  });

  document.addEventListener('keyup', (e) => {
    keys[e.key] = false;
  });

  startBtn.addEventListener('click', startGame);
  pauseBtn.addEventListener('click', togglePause);
  resetBtn.addEventListener('click', resetGame);

  initState();
</script>

</body>
</html>
